          name: Set positions
          command: |
            printf 'base 10000\n' > rope.cfg
      - run:
          name: Build positional encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ropeScale -j2
      - run:
          name: Scale RoPE frequencies
          command: LIONSS_LP=1 ./build/ropeScale --conf rope.cfg --factor 4

